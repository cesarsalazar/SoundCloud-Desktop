[package]
name = "chat-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client core of the SoundCloud Desktop chat"

[dependencies]
chat-wire = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "chat-wire-v0.1.0" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chacha20poly1305 = "=0.10.1"
hmac = "=0.12.1"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
uniffi = { version = "0.32", optional = true }

[features]
ffi = ["dep:uniffi"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
